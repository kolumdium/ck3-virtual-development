 vdev_convert.1.desc: "Convert [GetPlayer.MakeScope.ScriptValue('vdev_conversion_amount')|0] Normal Virtual Development to another type.\n\nCurrent Virtual Development:\nNormal: #V [vdev_selected_county.MakeScope.Var('vdev_county_normal').GetValue|0]#!\nOffensive: #V [vdev_selected_county.MakeScope.Var('vdev_county_offensive').GetValue|0]#!\nDefensive: #V [vdev_selected_county.MakeScope.Var('vdev_county_defensive').GetValue|0]#!\nHealth: #V [vdev_selected_county.MakeScope.Var('vdev_county_health').GetValue|0]#!\nInfrastructure: #V [vdev_selected_county.MakeScope.Var('vdev_county_infrastructure').GetValue|0]#!"
