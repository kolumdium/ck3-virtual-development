 vdev_manage_realm_event.1.desc: "Manage [vdev_current_barony.GetName]\n\nCurrent Virtual Development:\nNormal: #V [vdev_selected_county.MakeScope.Var('vdev_county_normal').GetValue|0]#!\nOffensive: #V [vdev_selected_county.MakeScope.Var('vdev_county_offensive').GetValue|0]#!\nDefensive: #V [vdev_selected_county.MakeScope.Var('vdev_county_defensive').GetValue|0]#!\nHealth: #V [vdev_selected_county.MakeScope.Var('vdev_county_health').GetValue|0]#!\nInfrastructure: #V [vdev_selected_county.MakeScope.Var('vdev_county_infrastructure').GetValue|0]#!\n\nUnavailable actions are disabled until their Gold and Virtual Development requirements are met."
 vdev_manage_realm_event.2.desc: "Manage the Virtual Development of [vdev_current_barony.GetName].\n\nCurrent resources:\nGold: #V [GetPlayer.GetGold|0]#!\nNormal Virtual Development: #V [vdev_selected_county.MakeScope.Var('vdev_county_normal').GetValue|0]#!\n\nRequirements:\nChange Focus: #V [GetPlayer.MakeScope.ScriptValue('vdev_focus_change_gold_cost')|0]#! Gold\nConvert Development: #V [GetPlayer.MakeScope.ScriptValue('vdev_convert_vdev_gold_cost')|0]#! Gold and #V [GetPlayer.MakeScope.ScriptValue('vdev_conversion_amount')|0]#! Normal Virtual Development"
 vdev_manage_realm_event.3.desc: "Manage construction in [vdev_current_barony.GetName].\n\nCurrent resources:\nGold: #V [GetPlayer.GetGold|0]#!\nNormal: #V [vdev_selected_county.MakeScope.Var('vdev_county_normal').GetValue|0]#!\nOffensive: #V [vdev_selected_county.MakeScope.Var('vdev_county_offensive').GetValue|0]#!\nDefensive: #V [vdev_selected_county.MakeScope.Var('vdev_county_defensive').GetValue|0]#!\nHealth: #V [vdev_selected_county.MakeScope.Var('vdev_county_health').GetValue|0]#!\nInfrastructure: #V [vdev_selected_county.MakeScope.Var('vdev_county_infrastructure').GetValue|0]#!\n\nRequirements:\nBuilding: #V [GetPlayer.MakeScope.ScriptValue('vdev_building_gold_cost')|0]#! Gold, a free building slot, and #V 25#! matching Virtual Development\nBuilding Slot: #V [GetPlayer.MakeScope.ScriptValue('vdev_building_slot_gold_cost')|0]#! Gold and #V [vdev_selected_county.MakeScope.ScriptValue('vdev_building_slot_vdev_cost')|0]#! Normal Virtual Development"
